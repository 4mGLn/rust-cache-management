[package]
name = "rust-cache-inspect"
version = "0.2.3"
edition = "2021"
rust-version = "1.86"
description = "Read-only, explicit-path Rust build cache diagnostics"
license = "MIT"
authors = ["4mGLn"]
repository = "https://github.com/4mGLn/rust-cache-management"
publish = false

[dependencies]
fs2 = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
strip = true
lto = "thin"
