name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  native:
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: windows-2025, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target ${{ matrix.target }}
      - name: Offline release safety tests
        run: node scripts/test-release.mjs
      - name: Test native Rust target
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: POSIX installer fixtures
        if: runner.os != 'Windows'
        run: sh scripts/test-distribution.sh
      - name: PowerShell parse check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1','scripts/package.ps1','scripts/test-distribution.ps1','scripts/test-distribution-live.ps1')) {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors -join "`n") }
          }
      - name: Package native Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-distribution.ps1 -Binary target/${{ matrix.target }}/release/rust-cache-inspect.exe
          $packageVersion='v'+((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/package.ps1 -Version $packageVersion -Binary target/${{ matrix.target }}/release/rust-cache-inspect.exe
      - name: Live Windows latest install from source without Version
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-distribution-live.ps1 -Mode Source
