name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Verify signed source and annotated tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release.mjs
  native:
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: windows-2025, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target ${{ matrix.target }}
      - name: Offline release safety tests
        run: node scripts/test-release.mjs
      - name: Test native target
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build native target
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: POSIX installer fixtures and packaging
        if: runner.os != 'Windows'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          sh scripts/test-distribution.sh
          sh scripts/package.sh "$RELEASE_VERSION" "$RELEASE_TARGET" "target/$RELEASE_TARGET/release/rust-cache-inspect" dist
      - name: Windows parse and packaging
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          foreach ($file in @('install.ps1','scripts/package.ps1','scripts/test-distribution.ps1')) {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors -join "`n") }
          }
          ./scripts/test-distribution.ps1 -Binary "target/$env:RELEASE_TARGET/release/rust-cache-inspect.exe"
          ./scripts/package.ps1 -Version $env:RELEASE_VERSION -Binary "target/$env:RELEASE_TARGET/release/rust-cache-inspect.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [verify, native]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Assemble checksums and bootstrap installers
        run: |
          cat dist/*.tar.gz.sha256 | LC_ALL=C sort > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum install.sh install.ps1 >> SHA256SUMS)
      - name: Publish new release after all native builds pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
